<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuickClip — Share text instantly</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="nav">
      <div class="brand"><span class="logo">Q</span><span>QuickClip</span></div>
      <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">☾</button>
    </header>

    <section class="hero">
      <div class="badge">⚡ Fast text sharing</div>
      <h1>Share text.<br><span>Anywhere.</span></h1>
      <p>Paste a message, generate a secure clip code, and open it from any device.</p>

      <div class="card">
        <div class="card-top">
          <span>New clip</span>
          <span id="counter">0 / 10,000</span>
        </div>
        <textarea id="text" maxlength="10000" placeholder="Paste or type your text here..."></textarea>
        <div class="actions">
          <button id="clearBtn" class="secondary">Clear</button>
          <button id="shareBtn" class="primary">Share clip <span>↗</span></button>
        </div>
      </div>

      <div id="result" class="result hidden">
        <div>
          <small>YOUR CLIP CODE</small>
          <strong id="code">------</strong>
        </div>
        <button id="copyBtn" class="secondary">Copy code</button>
      </div>

      <div class="retrieve">
        <span>Have a clip code?</span>
        <div class="retrieve-row">
          <input id="codeInput" maxlength="6" placeholder="e.g. A7K2Q9">
          <button id="openBtn" class="secondary">Open clip</button>
        </div>
      </div>
      <p id="status" class="status"></p>
    </section>

    <footer>QuickClip · Simple, fast, no account required</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
